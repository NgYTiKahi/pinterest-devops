global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']
  - job_name: backend
    static_configs:
      - targets: ['backend:8088']
