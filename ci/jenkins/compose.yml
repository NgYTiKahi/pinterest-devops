name: pins-ci
services:
  docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - certs:/certs/client
      - jenkins-home:/var/jenkins_home
      - docker-data:/var/lib/docker
    networks:
      ci:
        aliases: [docker]
    ports:
      - '127.0.0.1:8081:8080'
      - '127.0.0.1:3001:3000'
      - '127.0.0.1:9091:9090'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'docker', 'info']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  jenkins:
    build: .
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - jenkins-home:/var/jenkins_home
      - certs:/certs/client:ro
    networks: [ci]
    depends_on:
      docker: {condition: service_healthy}
    restart: unless-stopped
volumes:
  certs:
  jenkins-home:
  docker-data:
networks:
  ci:
